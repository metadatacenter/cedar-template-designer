<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CEDAR Template Designer</title>
  <base href="/">
  <link href="favicon.ico" rel="icon">
  <script src="config/version.js"></script>
</head>
<body>
  <header>
    <button id="back" type="button">← Workspace</button>
    <strong id="title">Template Designer</strong>
    <span id="state" role="status"></span>
    <button id="save" type="button" disabled>Save</button>
  </header>
  <p id="message" role="status">Loading designer…</p>
  <main id="editor"></main>
  <dialog id="version-dialog" aria-labelledby="version-title">
    <h2 id="version-title">Create a new template version?</h2>
    <p id="version-message"></p>
    <p>The existing template will be published and your changes saved as a new draft. Existing metadata stays with the original template.</p>
    <form method="dialog"><button value="cancel">Keep editing</button><button value="confirm">Create new draft</button></form>
  </dialog>
  <script src="scripts/keycloak/keycloak.min.js"></script>
  <script src="scripts/handlers/KeycloakUserHandler.js"></script>
  <script type="module">
    const version = encodeURIComponent(window.cedarCacheControl || 'local');
    const style = document.createElement('link');
    style.rel = 'stylesheet'; style.href = `styles/host.css?v=${version}`; document.head.append(style);
    import(`./scripts/host.mjs?v=${version}`);
  </script>
</body>
</html>
